name: Auto issue key (AIA matches issue #) + Share line w/ prefixes (dedup)

on:
  issues:
    types: [opened, labeled, unlabeled]  # will refresh suggestion when labels change
  issue_comment:
    types: [created]                     # allows "/key" or "/branch <prefix>"

permissions:
  issues: write

jobs:
  assign-key:
    # Outside contributors retain automatic issue formatting; commands are authorized below.
    if: >-
      github.event.issue && !github.event.issue.pull_request &&
      (github.event_name == 'issues' ||
       (github.event_name == 'issue_comment' &&
        (startsWith(github.event.comment.body || '', '/key') ||
         startsWith(github.event.comment.body || '', '/branch'))))
    runs-on: ubuntu-latest
    env:
      KEY_PREFIX: "AIA"
      PAD_WIDTH: "4"
      DEFAULT_BRANCH_PREFIX: "fix"         # fallback if no matching label/override
      ALLOWED_BRANCH_PREFIXES: "fix,feature,test"
      COMMENT_MARKER: "<!-- AIA_SHARE_BLOCK -->"  # used to find/update existing comment
    steps:
      # Keep privileged code inline: never check out or execute contributor-controlled files.
      - name: Authorize event, normalize title, and update suggestion
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;

            const allowed = (process.env.ALLOWED_BRANCH_PREFIXES || 'fix,feature,test')
              .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            let requested = null;
            if (context.eventName === 'issue_comment') {
              if (context.payload.action !== 'created') return;
              const comment = context.payload.comment;
              const body = typeof comment?.body === 'string' ? comment.body.trimEnd() : '';
              const branchCommand = body.match(/^\/branch[ \t]+([a-zA-Z0-9_-]+)$/);
              if (body !== '/key' && !branchCommand) return;
              requested = branchCommand ? branchCommand[1].toLowerCase() : null;
              if (requested && !allowed.includes(requested)) return;
              if (!comment?.user?.login) return;

              // Use the original comment author, including on reruns; associations are not permissions.
              // GitHub maps maintain to write and triage to read in this endpoint.
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: comment.user.login
              });
              if (!['write', 'admin'].includes(data?.permission)) {
                core.info('Issue commands require repository write access; skipping.');
                return;
              }
              // API errors fail the step before any mutation; do not fall back to author_association.
            } else if (context.eventName !== 'issues' ||
                       !['opened', 'labeled', 'unlabeled'].includes(context.payload.action)) {
              return;
            }

            const prefix = process.env.KEY_PREFIX;
            const keyPrefix = prefix;
            const padWidth = parseInt(process.env.PAD_WIDTH || '4', 10);
            const defaultBranchPrefix = (process.env.DEFAULT_BRANCH_PREFIX || 'fix').toLowerCase();
            const MARKER = process.env.COMMENT_MARKER || '<!-- AIA_SHARE_BLOCK -->';
            const n = issue.number;

            const originalTitle = issue.title;
            const finalRx = new RegExp(`^${prefix}-\\d{${padWidth},}:\\s`);
            if (finalRx.test(originalTitle)) {
              core.info('Title already normalized; skipping.');
            } else {
              // Strip provisional "AIA-XXXX:" or "AIA-123:"
              const stripRx = new RegExp(`^${prefix}-[A-ZX0-9]+:\\s*`, 'i');
              const baseTitle = originalTitle.replace(stripRx, '').trim();

              // Use GitHub issue number (matches URL)
              const padded = String(issue.number).padStart(padWidth, '0');
              const newTitle = `${prefix}-${padded}: ${baseTitle}`;

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: newTitle
              });

              core.info(`Updated title: ${newTitle}`);
            }

            // Read labels and title again after normalization.
            const { data: it } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n
            });
            const labelNames = (it.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
            const labelBased = allowed.find(p => labelNames.includes(p)) || null;
            const branchPrefix = requested || labelBased || defaultBranchPrefix;

            // Strip leading "AIA-0001: " from title
            const titleOnly = it.title.replace(new RegExp(`^${keyPrefix}-\\d{${padWidth},}:\\s*`), '');
            const padded = String(n).padStart(padWidth, '0');
            const key = `${keyPrefix}-${padded}`;

            // Make slug for branch tail
            const slug = titleOnly
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .replace(/-+/g, '-');

            const branch = `${branchPrefix}/${key}/${slug}`.slice(0, 120);
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${n}`;

            // Build the target comment body with a stable hidden marker
            const newBody = [
              MARKER,
              `**${key}**`,
              ``,
              `Share: ${url}`,
              ``,
              `Suggested branch (${branchPrefix}):`,
              '```',
              branch,
              '```',
              ...(context.eventName === 'issue_comment'
                ? ['', '_Updated suggestion per request._'] : [])
            ].join('\n');

            // Find existing bot comment with the marker
            let existing = null;
            for await (const page of github.paginate.iterator(
              github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
                per_page: 100
              }
            )) {
              for (const c of page.data) {
                if (c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]' && (c.body || '').includes(MARKER)) {
                  existing = c;
                }
              }
            }

            if (existing) {
              if ((existing.body || '').trim() === newBody.trim()) {
                core.info('Existing share comment is up-to-date; skipping.');
              } else {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: newBody
                });
                core.info(`Updated existing share comment (id=${existing.id}).`);
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
                body: newBody
              });
              core.info('Created new share comment.');
            }
