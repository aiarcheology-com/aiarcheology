name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR/push must not cancel a longer scheduled or manually requested scan.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          trap-caching: false
          dependency-caching: false

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload-database: false

  swift:
    name: CodeQL (swift, weekly or manual)
    # Cold dependency compilation/extraction exceeded 30 minutes before reaching app sources.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # CodeQL 2.27 cannot trace builds on macOS 27 or with Xcode 27.
    runs-on: macos-26-intel
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode for Swift
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
          trap-caching: false
          dependency-caching: false

      - name: Build Swift app without service keys
        shell: bash
        run: |
          # Follow the contributor Debug/simulator setup; no vault or production credential.
          cat > ios/Secrets.xcconfig <<'EOF'
          SENTRY_DSN =
          CLERK_PUBLISHABLE_KEY =
          CLERK_PUBLISHABLE_KEY_LIVE =
          CONFIGCAT_SDK_KEY =
          CONFIGCAT_SDK_KEY_LIVE =
          TELEMETRYDECK_APP_ID =
          EOF
          xcodebuild build \
            -project ios/MLBrowser.xcodeproj \
            -scheme MLBrowser \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/codeql-swift" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          # Trace the host-side public package products and credential/support-log tooling too.
          # The converter uses Float16; target ARM64 even on this Intel build host.
          swift build --arch arm64
          swift build --arch arm64 --package-path Tools --product ProjectTool

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
          upload-database: false
