name: Findings Worker

on:
  # This check is required on both protected branches, so always report a result.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Findings Worker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/findings-worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/findings-worker/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Check application and E2E types
        run: npm run typecheck

      - name: Run tests with local storage
        # vitest.config.ts sets remoteBindings=false and selects only test/unit.
        run: npm test

      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=moderate

      - name: Validate both bundles without deploying
        run: npm run dry-run
