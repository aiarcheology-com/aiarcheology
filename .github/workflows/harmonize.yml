name: Harmonize

on:
  pull_request:
    branches-ignore:
      - "copilot/**"
    paths:
      - "ios/**/*.swift"
      - "ios/**/*.c"
      - "ios/**/*.cc"
      - "ios/**/*.cpp"
      - "ios/**/*.h"
      - "ios/**/*.m"
      - "ios/**/*.mm"
      - "ios/.harmonize.yaml"
      - "ios/MLBrowser.xcodeproj/project.pbxproj"
      - "ios/MLBrowser.xcodeproj/xcshareddata/xcschemes/*.xcscheme"
      - "ios/MLBrowserTestPlan/*.xctestplan"
      - "ios/**/Package.resolved"
      - "scripts/harmonize.sh"
      - ".github/workflows/harmonize.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harmonize:
    name: Architecture Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Harmonize Tests
        run: ./scripts/harmonize.sh
        env:
          SPM_CACHE_PATH: ${{ github.workspace }}/.spm-cache
