name: Harmonize

on:
  # Report on every PR into the protected branches, including documentation-only changes.
  # Path filters would leave future required checks pending (AIA-0900).
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harmonize:
    name: Architecture Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify issue automation trust boundary
        run: node --test .github/tests/issue-automation.test.cjs

      - name: Verify Apple test-fixture setup
        run: python3 scripts/test_apple_test_models.py

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SPM packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Resolution is retried on its own because it is the only network-bound step:
      # binary targets (Sentry.xcframework.zip) come from GitHub Releases, which
      # intermittently returns 5xx. Retrying the test step instead would re-run the
      # whole build for every genuine architecture-rule failure.
      # A cache hit makes this a no-op — artifacts live under SourcePackages/artifacts.
      - name: Resolve package dependencies
        run: |
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies \
              -workspace ios/MLBrowser.xcworkspace \
              -scheme MLBrowserArchitectureTests \
              -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" && exit 0
            [ "$i" -eq 3 ] && break
            echo "Resolution failed (attempt $i/3); retrying in $((i * 20))s..."
            sleep $((i * 20))
          done
          echo "Package resolution failed after 3 attempts."
          exit 1
        env:
          SPM_CACHE_PATH: ${{ github.workspace }}/.spm-cache

      - name: Run Harmonize Tests
        run: ./scripts/harmonize.sh
        env:
          SPM_CACHE_PATH: ${{ github.workspace }}/.spm-cache
