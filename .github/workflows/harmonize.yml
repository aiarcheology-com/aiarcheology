name: Harmonize

on:
  pull_request:
    branches-ignore:
      - "copilot/**"
    paths:
      - "ios/**"
      - "scripts/harmonize.sh"
      - ".github/workflows/harmonize.yml"
  workflow_dispatch:

jobs:
  harmonize:
    name: Architecture Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Harmonize Tests
        run: ./scripts/harmonize.sh
        env:
          SPM_CACHE_PATH: ${{ github.workspace }}/.spm-cache
