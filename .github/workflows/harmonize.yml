name: Harmonize

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "ios/**"
      - "ios/.harmonize.yaml"
      - ".github/workflows/harmonize.yml"
  pull_request:
    paths:
      - "ios/**"
      - "ios/.harmonize.yaml"
      - ".github/workflows/harmonize.yml"
  workflow_dispatch:

jobs:
  harmonize:
    name: Architectural Lint
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Find Simulator ID
        id: simulator
        run: |
          # Extract iPhone 16 simulator ID for reliable destination matching
          SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Found simulator ID: $SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> $GITHUB_OUTPUT

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Resolve SPM Packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace MLBrowser.xcworkspace \
            -scheme MLBrowser \
            -clonedSourcePackagesDirPath ../SourcePackages

      - name: Run Harmonize Tests
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace MLBrowser.xcworkspace \
            -scheme MLBrowser \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:MLBrowserUnitTests/ArchitectureTests \
            -clonedSourcePackagesDirPath ../SourcePackages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --color || exit ${PIPESTATUS[0]}

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harmonize-test-results
          path: ios/TestResults.xcresult
