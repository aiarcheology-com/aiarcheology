name: Harmonize

on:
  push:
    branches-ignore:
      - "copilot/**"
    paths:
      - "ios/**"
      - "scripts/harmonize.sh"
      - ".github/workflows/harmonize.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/harmonize.sh"
      - ".github/workflows/harmonize.yml"
  workflow_dispatch:

jobs:
  harmonize:
    name: Architecture Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Harmonize Tests
        run: ./scripts/harmonize.sh
