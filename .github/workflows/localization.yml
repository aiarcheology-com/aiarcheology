name: Localization

# Guards the String Catalog against the drift that took coverage to 26% (AIA-0572): keys land in
# English, nothing complains, and the gap compounds one pull request at a time.
#
# Deliberately NOT part of Harmonize. That job needs macOS and a full Xcode build (~3 min);
# this check is pure Python, runs on Ubuntu in seconds, and fires on every
# change that can introduce an untranslated string — including a .swift change, since a new
# `Text("…")` literal is exactly how an untranslated string gets in.
on:
  # Deliberately NOT path-filtered, so this check can be required for PRs into develop and main.
  # As of 2026-09-14, ruleset 20571733 ("Localization must pass") is disabled. AIA-0900 tracks
  # enabling it after the repository becomes public and the other Actions checks are ready.
  # Keep the job name "Every string translated in every locale" stable: the ruleset references it.
  #
  # A required check that is path-filtered deadlocks: GitHub waits for a status that a skipped
  # workflow never reports, so any pull request not touching the filtered paths sits at
  # "Expected — waiting for status" and can never merge. The alternative is a companion job that
  # reports the same check name when paths do not match, which is machinery to save nine seconds.
  #
  # A run on an unrelated pull request re-verifies an unchanged catalog and is therefore a no-op,
  # but it costs about nine seconds of Ubuntu — no Xcode, no simulator, no network beyond checkout
  # — and ensures a result is available when enforcement is enabled. That trade is why the filter is gone.
  pull_request:
    branches-ignore:
      - "copilot/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Every string translated in every locale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Runs the exact script a developer runs locally, so "the same gate" is literal rather than
      # two implementations that drift. It prints the per-locale slot table (English count vs each
      # locale), fails on any missing or orphaned string, and ends with the catalog's own
      # round-trip invariants.
      - name: ./scripts/localization.sh
        run: |
          if ! ./scripts/localization.sh; then
            echo "::error::Some strings are not present in every locale — see the table above."
            echo "Reproduce and fix locally with: ./scripts/localization.sh"
            exit 1
          fi
