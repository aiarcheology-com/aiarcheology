name: SwiftLint

on:
  pull_request:
    paths:
      - "ios/**"
      - ".swiftlint.yml"
      - ".github/workflows/swiftlint.yml"
  workflow_dispatch:

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --force-exclude .
