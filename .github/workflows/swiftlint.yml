name: SwiftLint

on:
  # Report on every PR into the protected branches, including documentation-only changes.
  # Path filters would leave future required checks pending (AIA-0900).
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: Code Analysis
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache SwiftLint
        id: cache-swiftlint
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/swiftlint
          key: ${{ runner.os }}-swiftlint-${{ hashFiles('.tools.json') }}

      - name: Install SwiftLint
        run: |
          # Use cached SwiftLint binary if available.
          # The binary is originally downloaded and checksum-verified before being stored
          # in the GitHub Actions cache. We rely on GitHub's cache integrity guarantees
          # here, so we intentionally skip re-validating the SHA256 for cached artifacts.
          if [ -f /tmp/swiftlint/swiftlint ]; then
            echo "✅ Using cached SwiftLint"
          else
            echo "📦 Downloading SwiftLint..."
            VERSION=$(jq -r '.tools.swiftlint.version' .tools.json)
            SHA256=$(jq -r '.tools.swiftlint.sha256' .tools.json)
            curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${VERSION}/portable_swiftlint.zip"

            # Verify SHA256 checksum if available
            if [ "$SHA256" != "null" ] && [ -n "$SHA256" ]; then
              echo "Verifying SHA256 checksum..."
              ACTUAL_SHA256=$(shasum -a 256 /tmp/swiftlint.zip | awk '{print $1}')
              if [ "$ACTUAL_SHA256" != "$SHA256" ]; then
                echo "❌ SHA256 checksum mismatch!"
                echo "   Expected: $SHA256"
                echo "   Actual:   $ACTUAL_SHA256"
                exit 1
              fi
              echo "✅ SHA256 checksum verified"
            fi

            unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          fi

          sudo cp /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          sudo chmod +x /usr/local/bin/swiftlint
          swiftlint version

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --force-exclude .

      - name: Verify catalog ONNX entries stay oracle-verified
        run: ./scripts/verify_catalog_onnx_sync.sh
