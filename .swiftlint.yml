# SwiftLint Configuration (Root)
# https://realm.github.io/SwiftLint/rule-directory.html
#
# This is the root configuration that delegates to ios/.swiftlint.yml
# for actual linting rules. It ensures consistency across all execution
# contexts (pre-commit hooks, GitHub Actions, Xcode build phases).

# Paths to include (relative to this config file)
included:
  - ios

# Paths to exclude
excluded:
  - ios/**/Generated
  - ios/**/DerivedData
  - ios/**/.build
  - ios/**/Pods
  - ios/**/Carthage
  - ios/**/*.generated.swift
  - Tools
  - cloudflare

# Reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging)
reporter: "xcode"
