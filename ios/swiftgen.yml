# SwiftGen configuration for MLBrowser
# https://github.com/SwiftGen/SwiftGen

# String Catalogs (.xcstrings) for localization
strings:
  inputs:
    - MLBrowser/iOS/Resources/Localizable.xcstrings
  outputs:
    - templateName: structured-swift5
      output: MLBrowser/iOS/Generated/L10n.swift
      params:
        publicAccess: false
        enumName: L10n
